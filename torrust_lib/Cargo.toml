[package]
name = "torrust_lib"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10.6"
reqwest = "0.13.2"
url = "2.5.8"
percent-encoding = "2.3.2"
getrandom = "0.4.2"
tokio = { version = "1.50.0", features = ["fs", "signal", "macros", "rt-multi-thread", "net", "io-util", "time"] }
rand = "0.10.0"
hex = "0.4.3"
tracing = "0.1.44"
