# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: fmt
        name: cargo fmt
        description: Format files with cargo fmt
        entry: cargo fmt
        language: system
        types: [rust]
        args: ["--all", "--", "--check"]
        pass_filenames: false

      - id: clippy
        name: cargo clippy
        description: Lint rust sources
        entry: cargo clippy
        language: system
        types: [rust]
        args:
          - "--all-targets"
          - "--all-features"
          - "--"
          - "-D"
          - "warnings"
          - "-D"
          - "clippy::all"
          - "-D"
          - "clippy::pedantic"
        pass_filenames: false

      - id: test
        name: cargo test
        description: Run cargo tests
        entry: cargo test
        language: system
        types: [rust]
        args: ["--all", "--locked"]
        pass_filenames: false

      - id: check
        name: cargo check
        description: Check the package for errors
        entry: cargo check
        language: system
        types: [rust]
        args: ["--all", "--locked"]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
