# Install:
#   pre-commit install
#   pre-commit install --hook-type pre-push
#
# Run manually:
#   pre-commit run --all-files

default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # ── pre-commit ──────────────────────────────────────

      - id: fmt
        name: cargo fmt
        entry: cargo fmt
        language: system
        types: [rust]
        args: ["--all"]
        pass_filenames: false
        stages: [pre-commit]

      - id: clippy
        name: cargo clippy
        entry: cargo clippy
        language: system
        types: [rust]
        args:
          - "--all-targets"
          - "--"
          - "-D"
          - "warnings"
        pass_filenames: false
        stages: [pre-commit]

      # ── pre-push ────────────────────────────────────────

      - id: test
        name: cargo test
        entry: cargo test
        language: system
        args: ["--workspace", "--locked"]
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

      - id: check-yaml
      - id: check-toml

      - id: check-added-large-files
        args: ["--maxkb=1000"]

      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks

      - id: mixed-line-ending
        args: ["--fix=lf"]
