[package]
name = "torrust"
version = "0.1.0"
edition = "2024"

[dependencies]
torrust_lib = { path = "torrust_lib" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.29"
crossterm = "0.28"
reqwest = "0.13.2"
